[project]
name = "ovvs"
version = "0.2.0"
description = "ovVS Python bindings (ctypes over libovvs C ABI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
bench = [
  "numpy>=1.23",
  "h5py>=3.8",
  "faiss-cpu>=1.9",
  "hnswlib>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ovvs*"]
